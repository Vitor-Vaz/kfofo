services:
  - type: web
    name: kfofo
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kfofo-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: PHX_SERVER
        value: "true"
      - key: PORT
        value: "10000"
      - key: PHX_HOST
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false

databases:
  - name: kfofo-db
    databaseName: kfofo_prod
    user: kfofo
    plan: free
    region: oregon
